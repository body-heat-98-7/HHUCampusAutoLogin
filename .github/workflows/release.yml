name: Build Windows release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Install test tools
        run: python -m pip install pytest
      - name: Run offline tests
        run: python -m pytest tests -q
      - name: Build and verify executables
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'v1.0.4' }
          ./build.ps1 -Version $version
      - name: Upload Windows download
        uses: actions/upload-artifact@v7
        with:
          name: HHUCampusAutoLogin-windows-x64
          path: |
            dist/HHUCampusAutoLogin-*-windows-x64.zip
            dist/HHUCampusAutoLogin-*-windows-x64.zip.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: HHUCampusAutoLogin-windows-x64
          path: release
      - name: Publish release download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --title "$RELEASE_TAG" \
            --generate-notes \
            --notes '**Windows 64 位免 Python 版**：下载 `windows-x64.zip`，完整解压到固定文件夹后双击 `install.cmd`。请保留两个 EXE（主程序用于配置，background 用于计划任务）。使用前请先看 README 顶部的「⚠️ 特别提醒」，尤其是用代理 / 加速器的同学。以下为本版本相对上一版的代码变更：'
